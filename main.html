<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Scrubber</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wrapper">
    <video class="flex" width="765" height="430" src="http://clips.vorwaerts-gmbh.de/VfE_html5.mp4" controls></video>
    <div class="speed">
      <div class="speed-bar">1×</div>
    </div>
  </div>

<script  src="./script.js">
  
const speed = document.querySelector(".speed");
const bar = document.querySelector(".speed-bar");
const video = document.querySelector(".wrapper video");

function handleMove(e) {
    const y = e.pageY - speed.getBoundingClientRect().top - window.scrollY;
    const percent = Math.min(Math.max(y / speed.offsetHeight, 0), 1);

    const min = 0.4;
    const max = 4;
    const playbackRate = percent * (max - min) + min;

    bar.style.height = `${percent * 100}%`;
    bar.textContent = `${playbackRate.toFixed(1)}×`;

    video.playbackRate = playbackRate;
}

speed.addEventListener("mousemove", handleMove);

</script>
</body>
</html>
